<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>GeoIPT - BBOX Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/bbox_test.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    header {
      background: #020617;
      border-bottom: 1px solid #111827;
      padding: 10px 16px;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    #map {
      height: 420px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 24px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      color: #38bdf8;
    }

    p {
      margin: 4px 0;
      line-height: 1.4;
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      border-radius: 8px;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #btn-reporte {
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #ffffff;
      cursor: pointer;
      margin-top: 24px;
      opacity: 0.5;
    }

    #btn-reporte:disabled {
      cursor: default;
    }

    .btn-container {
      text-align: center;
    }

    /* ✅ NUEVO: estilos para el link de descarga */
    #link-kml {
      color:#38bdf8;
      text-decoration:underline;
      font-size:0.95rem;
      cursor:pointer;
    }

    /* estado deshabilitado visual */
    #link-kml.is-disabled {
      opacity: 0.5;
    }
  </style>
</head>

<!-- prueba commit 17:30hrs -->

<body>
  <div class="container">
    <header>
      <h1>Reporte GeoIPT - Reporte del punto consultado</h1>
    </header>

    <main>
      <!-- Mapa -->
      <div id="map"></div>

      <h2>Metadata de la Zona</h2>

      <table id="tabla-metadata" style="
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: #0f172a;
        color: #e5e7eb;
        font-size: 0.9rem;
      ">
        <tbody>
          <tr>
            <th style="text-align:left; padding:6px; border-bottom:1px solid #1e293b;">Campo</th>
            <th style="text-align:left; padding:6px; border-bottom:1px solid #1e293b;">Valor</th>
          </tr>

          <tr><td>REG</td><td id="md-reg">–</td></tr>
          <tr><td>COM</td><td id="md-com">–</td></tr>
          <tr><td>LOCALIDAD</td><td id="md-loc">–</td></tr>
          <tr><td>ZONA</td><td id="md-zona">–</td></tr>
          <tr><td>NOMBRE</td><td id="md-nombre">–</td></tr>
          <tr><td>UPERM</td><td id="md-uperm">–</td></tr>
          <tr><td>UPROH</td><td id="md-uproh">–</td></tr>
          <tr><td>Capa</td><td id="md-capa">–</td></tr>
          <tr><td>CUT</td><td id="md-cut">–</td></tr>
        </tbody>
      </table>

      <p style="margin-top:10px;">
        <!-- ✅ Se mantiene tu link, pero ahora lo controlamos con JS (login/no-login) -->
        <a id="link-kml"
           href="#"
           class="is-disabled"
           title="Inicia sesión para descargar"
           aria-disabled="true"
        >Descargar KML de la zona consultada</a>
      </p>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Turf -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- toGeoJSON -->
    <script src="https://unpkg.com/@tmcw/togeojson@4.5.0/dist/togeojson.umd.js"></script>

    <!-- Lógica propia (tu script actual) -->
    <script src="js/bbox_test.js"></script>

    <!-- ✅ NUEVO: control login + habilitar/deshabilitar descarga (módulo) -->
    <script type="module">
      import { onUserChanged } from "./js/auth.js";
      import { downloadKML } from "./js/ui-auth.js";

      const link = document.getElementById("link-kml");

      function setEnabled(enabled) {
        if (enabled) {
          link.classList.remove("is-disabled");
          link.style.pointerEvents = "auto";
          link.setAttribute("aria-disabled", "false");
          link.title = "";
        } else {
          link.classList.add("is-disabled");
          link.style.pointerEvents = "auto"; // 👈 importante: dejamos clickeable para mostrar mensaje
          link.setAttribute("aria-disabled", "true");
          link.title = "Inicia sesión para descargar";
        }
      }

      // Estado inicial: deshabilitado
      setEnabled(false);

      // Click: si no está logueado => invitación; si está logueado => descargar
      link.addEventListener("click", async (e) => {
        e.preventDefault();

        // Si está deshabilitado, redirige a login con mensaje
        if (link.getAttribute("aria-disabled") === "true") {
          alert("Inicia sesión para descargar");
          window.location.href = "login.html";
          return;
        }

        // Si quieres pasar parámetros del reporte al KML:
        // En bbox_test.js puedes setear: window.geoiptKmlQuery = `?cut=...&capa=...&zona=...`;
        const qs = window.geoiptKmlQuery || "";
        await downloadKML(qs);
      });

      // Cambios de sesión: habilita o deshabilita
      onUserChanged((user) => {
        setEnabled(!!user);
      });
    </script>

  </div>

  <footer style="
    text-align:center;
    padding:16px;
    margin-top:40px;
    color:#64748b;
    font-size:0.8rem;
    border-top:1px solid #1e293b;
  ">
    © GeoIPT — geocalculo.cl
  </footer>
</body>
</html>
