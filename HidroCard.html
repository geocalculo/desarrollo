<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARD - GeoHidro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <span class="header-icon">&#128200;</span>
    <span class="header-name">GeoHidro &mdash; CARD</span>
  </div>
  <nav class="header-nav">
    <a href="index.html" class="btn-card">Volver al Inicio</a>
  </nav>
</header>

<main class="site-main">
  <section class="hero">
    <h1>Análisis Territorial</h1>
    <p class="subtitle">Indicadores clave del sistema geoespacial</p>
  </section>

  <section class="kpi-row">
    <div class="kpi-card">
      <span class="kpi-value">1,240</span>
      <span class="kpi-label">Puntos Monitoreados</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-value">87.3%</span>
      <span class="kpi-label">Cobertura Territorial</span>
    </div>
    <div class="kpi-card">
      <span class="kpi-value">56</span>
      <span class="kpi-label">Capas Activas</span>
    </div>
  </section>

  <section class="map-container">
    <div class="map-placeholder">
      <span class="map-icon">&#128506;</span>
      <p>MAPA CARD</p>
      <p class="map-hint">Visor de análisis territorial</p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>GeoHidro CARD &bull; v1.0</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
